<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#BBECFC" />
    <title>Rastreador GPS para Firebase</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap");

        :root {
            --neutral-dark-pure: #121212;
            --neutral-dark-low: #424242;
            --neutral-dark-high: #A3A3A3;
            --neutral-light-pure: #FFFFFF;
            --neutral-light-high: #F5F5F5;
            --neutral-light-low: #E0E0E0;
            --action-primary-pure: #002555;
            --action-primary-low: #00122A;
            --action-primary-high: #BFC8D4;
            --action-secondary-pure: #F5AC00;
            --action-secondary-low: #7A5600;
            --action-secondary-high: #FCEABF;
            --feedback-positive-pure: #54D073;
            --feedback-positive-low: #1C662E;
            --feedback-positive-high: #CFF2D8;
            --feedback-negative-pure: #FF8771;
            --feedback-negative-low: #991700;
            --feedback-negative-high: #FFDAD3;
            --feedback-warning-pure: #FFAA33;
            --feedback-warning-low: #8C4400;
            --feedback-warning-high: #FFEAC1;
            --bg-system-pure: #B5B3B3;
            --bg-system-low: #454444;
            --bg-system-high: #E4E4E4;
            --bg-public-1-pure: #39C1EC;
            --bg-public-1-low: #1F6C87;
            --bg-public-1-high: #BBECFC;
            --bg-public-2-pure: #1245FF;
            --bg-public-2-low: #092380;
            --bg-public-2-high: #C4D0FF;

            --bg-main: #f4f8fd;
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-main: var(--action-primary-pure);
            --text-soft: #4a5664;
            --line: #d5dbe3;
            --primary: var(--action-primary-pure);
            --primary-strong: var(--action-primary-low);
            --danger: #5c6470;
            --danger-strong: #3f4650;
            --shadow: 0 14px 28px rgba(18, 18, 18, 0.11);
        }

        body[data-theme="dark"] {
            --bg-main: #121212;
            --bg-card: rgba(18, 18, 18, 0.9);
            --text-main: var(--neutral-light-pure);
            --text-soft: var(--neutral-dark-high);
            --line: #3a3a3a;
            --primary: var(--bg-public-2-pure);
            --primary-strong: var(--bg-public-2-low);
            --danger: #666666;
            --danger-strong: #4a4a4a;
            --shadow: 0 16px 42px rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at 10% 12%, rgba(0, 37, 85, 0.12), transparent 36%),
                radial-gradient(circle at 84% 14%, rgba(255, 199, 44, 0.14), transparent 34%),
                linear-gradient(160deg, #f9fcff, #f3f7fc 56%, #eef4fb);
            padding: 22px;
        }

        body[data-theme="dark"] {
            background:
                radial-gradient(circle at 12% 18%, rgba(18, 69, 255, 0.16), transparent 38%),
                radial-gradient(circle at 88% 10%, rgba(255, 199, 44, 0.1), transparent 35%),
                linear-gradient(160deg, #121212, #181818 56%, #1f1f1f);
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(6px);
            animation: surgir 0.52s ease both;
        }

        h1 {
            margin: 0;
            font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
            font-size: clamp(1.3rem, 1rem + 1.2vw, 2rem);
            letter-spacing: -0.02em;
        }

        .subtitulo {
            margin: 8px 0 0;
            color: var(--text-soft);
            max-width: 60ch;
        }

        .topo-links {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .chip-link {
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.7);
            transition: all 0.22s ease;
            background: #ffffff;
        }

        .chip-link:hover {
            transform: translateY(-1px);
            border-color: var(--action-primary-pure);
            color: var(--primary-strong);
        }

        .theme-toggle {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 700;
            background: #ffffff;
            color: var(--text-main);
            cursor: pointer;
        }

        body[data-theme="dark"] .theme-toggle,
        body[data-theme="dark"] .chip-link {
            background: #242424;
            color: var(--neutral-light-pure);
        }

        .bloco {
            margin-top: 18px;
            background: linear-gradient(165deg, var(--neutral-light-pure), #f7fafc);
            border: 1px solid rgba(19, 38, 59, 0.12);
            border-radius: 18px;
            padding: 14px;
        }

        body[data-theme="dark"] .bloco {
            background: linear-gradient(165deg, #1a1a1a, #242424);
            border-color: #424242;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            margin-top: 12px;
            color: var(--text-soft);
            font-weight: 600;
        }

        body[data-theme="dark"] label {
            color: #d8e4f2;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(19, 38, 59, 0.2);
            border-radius: 9px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.95);
            font: inherit;
            color: var(--text-main);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: var(--text-soft);
            opacity: 1;
        }

        body[data-theme="dark"] input {
            background: rgba(11, 20, 30, 0.9);
            border-color: rgba(175, 194, 216, 0.25);
        }

        input:focus {
            outline: none;
            border-color: var(--action-primary-pure);
            box-shadow: 0 0 0 3px rgba(0, 37, 85, 0.14);
        }

        .linha {
            display: grid;
            gap: 6px;
            grid-template-columns: 1fr;
        }

        .botoes {
            margin-top: 16px;
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr;
        }

        button {
            border: 0;
            border-radius: 10px;
            min-height: 44px;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.18s ease, filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        #iniciar {
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        }

        #parar {
            background: linear-gradient(135deg, var(--danger), var(--danger-strong));
        }

        .estado {
            margin-top: 14px;
            color: var(--text-soft);
            font-size: 0.95rem;
            word-break: break-word;
            min-height: 1.2rem;
        }

        body[data-theme="dark"] .estado {
            color: #c9d8e8;
        }

        .dados {
            margin-top: 10px;
            font-size: 0.92rem;
            background: #eef3f9;
            border: 1px solid rgba(19, 38, 59, 0.13);
            border-radius: 9px;
            padding: 11px;
            color: var(--action-primary-low);
        }

        body[data-theme="dark"] .dados {
            background: rgba(17, 32, 49, 0.9);
            border-color: rgba(170, 191, 213, 0.28);
            color: #e3eefb;
        }

        @keyframes surgir {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 12px;
            }

            main {
                border-radius: 14px;
                padding: 14px;
            }

            .bloco {
                border-radius: 11px;
                padding: 12px;
            }
        }

        @media (max-width: 520px) {
            .botoes {
                grid-template-columns: 1fr;
            }

            .theme-toggle {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Rastreador GPS</h1>
        <p class="subtitulo">Envie localizacao em tempo real com uma interface mais dinamica para operacao de frota.</p>
        <nav class="topo-links" aria-label="Navegacao rapida">
            <a class="chip-link" href="index.html">Abrir painel de mapa</a>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar modo escuro">🌙 Tema</button>
        </nav>

        <section class="bloco">
            <div class="linha">
                <label for="nome">Nome exibido no painel</label>
                <input id="nome" type="text" value="Meu celular" />

                <label for="docId">ID do documento (unico por aparelho)</label>
                <input id="docId" type="text" value="celular-001" />
            </div>

            <div class="botoes">
                <button id="iniciar" type="button">Iniciar envio</button>
                <button id="parar" type="button">Parar envio</button>
            </div>

            <p id="estado" class="estado">Aguardando inicio...</p>
            <div id="dados" class="dados">Sem dados de GPS ainda.</div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMnCYEYdmL6G3Qck0rivbKi-g1P9lMyYU",
            authDomain: "maps2-6bf71.firebaseapp.com",
            projectId: "maps2-6bf71",
            storageBucket: "maps2-6bf71.firebasestorage.app",
            messagingSenderId: "944119305149",
            appId: "1:944119305149:web:91510adbd653e46edf78d4",
            measurementId: "G-SNRTBFDX41"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        isSupported().then((ok) => {
            if (ok) {
                getAnalytics(app);
            }
        });

        const nomeInput = document.getElementById("nome");
        const docIdInput = document.getElementById("docId");
        const estado = document.getElementById("estado");
        const dados = document.getElementById("dados");
        const themeToggle = document.getElementById("theme-toggle");
        const iniciar = document.getElementById("iniciar");
        const parar = document.getElementById("parar");
        const STORAGE_THEME_KEY = "monitor-tema";

        function aplicarTema(tema) {
            const temaFinal = tema === "dark" ? "dark" : "light";
            document.body.setAttribute("data-theme", temaFinal);
            localStorage.setItem(STORAGE_THEME_KEY, temaFinal);
            themeToggle.textContent = temaFinal === "dark" ? "☀️ Tema" : "🌙 Tema";
        }

        function iniciarTema() {
            const salvo = localStorage.getItem(STORAGE_THEME_KEY);
            if (salvo) {
                aplicarTema(salvo);
                return;
            }

            const prefereEscuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            aplicarTema(prefereEscuro ? "dark" : "light");
        }

        const nomeColecao = "nomeDoLocal";
        let watchId = null;

        async function salvarPosicao(posicao) {
            const nomeDoLocal = nomeInput.value.trim() || "Meu celular";
            const docId = docIdInput.value.trim() || "celular-001";

            const latitude = posicao.coords.latitude;
            const longitude = posicao.coords.longitude;
            const precisao = posicao.coords.accuracy;

            await setDoc(
                doc(db, nomeColecao, docId),
                {
                    nomeDoLocal,
                    latitude,
                    longitude,
                    precisao,
                    atualizadoEm: serverTimestamp()
                },
                { merge: true }
            );

            estado.textContent = "GPS enviado para o Firestore com sucesso.";
            dados.textContent = `Lat: ${latitude.toFixed(6)} | Lng: ${longitude.toFixed(6)} | Precisao: ${Math.round(precisao)}m`;
        }

        function tratarErroGps(erro) {
            const mapa = {
                1: "Permissao de localizacao negada.",
                2: "Localizacao indisponivel.",
                3: "Tempo esgotado para obter localizacao."
            };

            estado.textContent = mapa[erro.code] || "Falha ao obter localizacao.";
        }

        function iniciarRastreamento() {
            if (!navigator.geolocation) {
                estado.textContent = "Seu navegador nao suporta Geolocation.";
                return;
            }

            if (watchId !== null) {
                estado.textContent = "Rastreamento ja esta ativo.";
                return;
            }

            estado.textContent = "Solicitando permissao de localizacao...";

            watchId = navigator.geolocation.watchPosition(
                (posicao) => {
                    salvarPosicao(posicao).catch((erro) => {
                        console.error("Erro ao salvar no Firestore:", erro);
                        estado.textContent = "Erro ao salvar no Firestore. Verifique regras e conexao.";
                    });
                },
                tratarErroGps,
                {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 10000
                }
            );
        }

        function pararRastreamento() {
            if (watchId === null) {
                estado.textContent = "Rastreamento nao estava ativo.";
                return;
            }

            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            estado.textContent = "Rastreamento pausado.";
        }

        iniciar.addEventListener("click", iniciarRastreamento);
        parar.addEventListener("click", pararRastreamento);
        themeToggle.addEventListener("click", () => {
            const atual = document.body.getAttribute("data-theme") === "dark" ? "dark" : "light";
            aplicarTema(atual === "dark" ? "light" : "dark");
        });

        iniciarTema();
    </script>
</body>
</html>
