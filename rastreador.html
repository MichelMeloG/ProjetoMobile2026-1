<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rastreador GPS para Firebase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 16px;
            background: #f3f4f6;
            color: #111827;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 14px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.92rem;
            margin-bottom: 6px;
            margin-top: 10px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .linha {
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr;
        }

        .botoes {
            margin-top: 12px;
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr 1fr;
        }

        button {
            border: 0;
            border-radius: 6px;
            min-height: 42px;
            color: #ffffff;
            font-weight: 600;
        }

        #iniciar {
            background: #059669;
        }

        #parar {
            background: #dc2626;
        }

        .estado {
            margin-top: 10px;
            color: #4b5563;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .dados {
            margin-top: 10px;
            font-size: 0.9rem;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Enviar GPS do Celular</h1>
        <p>Esta pagina envia sua localizacao em tempo real para o Firestore.</p>

        <div class="linha">
            <label for="nome">Nome exibido no painel</label>
            <input id="nome" type="text" value="Meu celular" />

            <label for="docId">ID do documento (unico por aparelho)</label>
            <input id="docId" type="text" value="celular-001" />
        </div>

        <div class="botoes">
            <button id="iniciar" type="button">Iniciar envio</button>
            <button id="parar" type="button">Parar envio</button>
        </div>

        <p id="estado" class="estado">Aguardando inicio...</p>
        <div id="dados" class="dados">Sem dados de GPS ainda.</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMnCYEYdmL6G3Qck0rivbKi-g1P9lMyYU",
            authDomain: "maps2-6bf71.firebaseapp.com",
            projectId: "maps2-6bf71",
            storageBucket: "maps2-6bf71.firebasestorage.app",
            messagingSenderId: "944119305149",
            appId: "1:944119305149:web:91510adbd653e46edf78d4",
            measurementId: "G-SNRTBFDX41"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        isSupported().then((ok) => {
            if (ok) {
                getAnalytics(app);
            }
        });

        const nomeInput = document.getElementById("nome");
        const docIdInput = document.getElementById("docId");
        const estado = document.getElementById("estado");
        const dados = document.getElementById("dados");
        const iniciar = document.getElementById("iniciar");
        const parar = document.getElementById("parar");

        const nomeColecao = "nomeDoLocal";
        let watchId = null;

        async function salvarPosicao(posicao) {
            const nomeDoLocal = nomeInput.value.trim() || "Meu celular";
            const docId = docIdInput.value.trim() || "celular-001";

            const latitude = posicao.coords.latitude;
            const longitude = posicao.coords.longitude;
            const precisao = posicao.coords.accuracy;

            await setDoc(
                doc(db, nomeColecao, docId),
                {
                    nomeDoLocal,
                    latitude,
                    longitude,
                    precisao,
                    atualizadoEm: serverTimestamp()
                },
                { merge: true }
            );

            estado.textContent = "GPS enviado para o Firestore com sucesso.";
            dados.textContent = `Lat: ${latitude.toFixed(6)} | Lng: ${longitude.toFixed(6)} | Precisao: ${Math.round(precisao)}m`;
        }

        function tratarErroGps(erro) {
            const mapa = {
                1: "Permissao de localizacao negada.",
                2: "Localizacao indisponivel.",
                3: "Tempo esgotado para obter localizacao."
            };

            estado.textContent = mapa[erro.code] || "Falha ao obter localizacao.";
        }

        function iniciarRastreamento() {
            if (!navigator.geolocation) {
                estado.textContent = "Seu navegador nao suporta Geolocation.";
                return;
            }

            if (watchId !== null) {
                estado.textContent = "Rastreamento ja esta ativo.";
                return;
            }

            estado.textContent = "Solicitando permissao de localizacao...";

            watchId = navigator.geolocation.watchPosition(
                (posicao) => {
                    salvarPosicao(posicao).catch((erro) => {
                        console.error("Erro ao salvar no Firestore:", erro);
                        estado.textContent = "Erro ao salvar no Firestore. Verifique regras e conexao.";
                    });
                },
                tratarErroGps,
                {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 10000
                }
            );
        }

        function pararRastreamento() {
            if (watchId === null) {
                estado.textContent = "Rastreamento nao estava ativo.";
                return;
            }

            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            estado.textContent = "Rastreamento pausado.";
        }

        iniciar.addEventListener("click", iniciarRastreamento);
        parar.addEventListener("click", pararRastreamento);
    </script>
</body>
</html>
