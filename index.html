<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitoramento de Onibus em Tempo Real</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <style>
        :root {
            --bg-panel: rgba(255, 255, 255, 0.94);
            --text-main: #13263b;
            --text-soft: #4f5f73;
            --line: rgba(19, 38, 59, 0.16);
            --accent: #0f9d85;
            --accent-strong: #0b7a67;
            --shadow: 0 14px 34px rgba(14, 33, 56, 0.16);
            --map-background: #dbe4ee;
        }

        body[data-theme="dark"] {
            --bg-panel: rgba(17, 28, 40, 0.94);
            --text-main: #e5edf7;
            --text-soft: #a4b7ce;
            --line: rgba(206, 221, 238, 0.16);
            --accent: #22b89b;
            --accent-strong: #17a187;
            --shadow: 0 20px 34px rgba(0, 0, 0, 0.42);
            --map-background: #0f1a27;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            background: var(--map-background);
        }

        #map {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        .topbar {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 1000;
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(7px);
        }

        .actions-button {
            border: 0;
            background: linear-gradient(130deg, #1f76bf, #295f9a);
            color: #ffffff;
            border-radius: 9px;
            min-height: 36px;
            padding: 0 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .headline {
            margin: 0;
            color: var(--text-soft);
            font-size: 0.9rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 8px;
        }

        .floating-link {
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 11px;
            font-size: 0.84rem;
            font-weight: 600;
            background: #ffffff;
        }

        body[data-theme="dark"] .floating-link {
            background: rgba(12, 20, 30, 0.92);
            color: #dbe9f9;
        }

        .theme-toggle {
            border: 1px solid var(--line);
            border-radius: 999px;
            min-height: 36px;
            padding: 0 12px;
            background: #ffffff;
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
        }

        body[data-theme="dark"] .theme-toggle {
            background: rgba(12, 20, 30, 0.92);
            color: #dbe9f9;
        }

        .panel {
            position: fixed;
            top: 82px;
            left: 16px;
            bottom: 16px;
            width: 360px;
            z-index: 999;
            background: var(--bg-panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            gap: 10px;
            padding: 14px;
            transition: transform 0.3s ease;
        }

        .panel h1 {
            margin: 0 0 8px;
            font-size: 1.15rem;
        }

        .panel p {
            margin: 0;
            color: var(--text-soft);
            line-height: 1.35;
            font-size: 0.92rem;
        }

        .cards-intro {
            margin-top: 8px;
            font-size: 0.84rem;
            color: var(--text-soft);
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 2px 0 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: auto;
            padding-right: 2px;
        }

        .device-item {
            border: 1px solid rgba(19, 38, 59, 0.14);
            border-radius: 11px;
            padding: 11px;
            margin-top: 2px;
            background: linear-gradient(160deg, #ffffff, #f3f8fc);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        body[data-theme="dark"] .device-item {
            background: linear-gradient(160deg, rgba(16, 28, 40, 0.95), rgba(23, 36, 51, 0.95));
            border-color: rgba(173, 195, 220, 0.18);
        }

        .device-item:hover {
            border-color: rgba(15, 122, 103, 0.42);
        }

        .device-item.active {
            border-color: rgba(15, 122, 103, 0.8);
            box-shadow: inset 0 0 0 1px rgba(15, 122, 103, 0.35);
            background: linear-gradient(160deg, #e8f6f2, #f2fbf8);
        }

        body[data-theme="dark"] .device-item.active {
            background: linear-gradient(160deg, rgba(21, 61, 72, 0.92), rgba(18, 50, 60, 0.92));
        }

        .device-item strong {
            display: block;
            font-size: 0.93rem;
            margin-bottom: 3px;
        }

        .device-top {
            display: flex;
            gap: 8px;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 3px;
        }

        .device-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 5px;
        }

        .status-pill {
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 0.74rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-pill.on-time {
            background: rgba(26, 160, 131, 0.14);
            color: #16715d;
        }

        .status-pill.late {
            background: rgba(221, 79, 90, 0.16);
            color: #a83541;
        }

        .status-pill.coming {
            background: rgba(240, 169, 58, 0.18);
            color: #8f6115;
        }

        .status-pill.offline {
            background: rgba(97, 113, 130, 0.2);
            color: #3d4b5a;
        }

        body[data-theme="dark"] .status-pill.on-time {
            background: rgba(40, 185, 154, 0.2);
            color: #97f0dd;
        }

        body[data-theme="dark"] .status-pill.late {
            background: rgba(223, 97, 109, 0.2);
            color: #ffbec4;
        }

        body[data-theme="dark"] .status-pill.coming {
            background: rgba(239, 178, 77, 0.2);
            color: #ffd594;
        }

        body[data-theme="dark"] .status-pill.offline {
            background: rgba(124, 144, 165, 0.2);
            color: #d1dfed;
        }

        .time-pill {
            border-radius: 999px;
            padding: 3px 8px;
            background: rgba(31, 118, 191, 0.12);
            color: #1c5f99;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        body[data-theme="dark"] .time-pill {
            background: rgba(53, 154, 240, 0.18);
            color: #93cbff;
        }

        .device-desc {
            font-size: 0.82rem;
            color: var(--text-soft);
            margin-bottom: 4px;
            line-height: 1.35;
        }

        .device-item span,
        .device-item small {
            color: var(--text-soft);
            display: block;
            font-size: 0.86rem;
        }

        .legend {
            border-top: 1px dashed rgba(19, 38, 59, 0.2);
            padding-top: 10px;
            color: var(--text-soft);
            font-size: 0.84rem;
            display: grid;
            gap: 4px;
        }

        .pill {
            position: fixed;
            z-index: 900;
            right: 16px;
            bottom: 18px;
            background: rgba(19, 38, 59, 0.9);
            color: #ecf2f8;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.83rem;
            border: 1px solid rgba(236, 242, 248, 0.2);
        }

        .leaflet-tooltip.bus-label {
            background: rgba(13, 34, 56, 0.88);
            color: #f5f8fc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            box-shadow: none;
            font-size: 0.8rem;
            padding: 4px 8px;
            font-weight: 600;
        }

        body[data-theme="dark"] .leaflet-popup-content-wrapper,
        body[data-theme="dark"] .leaflet-popup-tip {
            background: #122133;
            color: #e2ecf7;
        }

        .bus-marker {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: #1f76bf;
            color: #ffffff;
            border: 2px solid #ffffff;
            box-shadow: 0 8px 14px rgba(14, 33, 56, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1;
            transform: translateY(-1px);
            transition: transform 0.18s ease;
        }

        .bus-marker.active {
            background: var(--accent-strong);
            transform: translateY(-2px) scale(1.08);
        }

        body[data-theme="dark"] .bus-marker {
            border-color: rgba(255, 255, 255, 0.85);
        }

        @media (max-width: 960px) {
            .topbar {
                grid-template-columns: auto 1fr auto;
                padding-right: 8px;
            }

            .floating-link {
                display: none;
            }

            .panel {
                width: min(88vw, 360px);
            }
        }

        @media (max-width: 620px) {
            .topbar {
                top: 10px;
                left: 10px;
                right: 10px;
                gap: 8px;
                padding: 8px;
            }

            .panel {
                top: 66px;
                left: 10px;
                bottom: 10px;
                width: calc(100vw - 20px);
                transform: translateX(-110%);
            }

            .actions-button,
            .theme-toggle {
                min-height: 40px;
                padding: 0 11px;
            }

            .headline {
                font-size: 0.82rem;
                text-align: left;
            }

            .panel.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div id="map" aria-label="Mapa interativo"></div>

    <header class="topbar">
        <button id="menu-toggle" class="actions-button" type="button" aria-label="Abrir menu">Menu</button>
        <p id="mapa-estado" class="headline">Conectando ao Firestore...</p>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar modo escuro">🌙</button>
        <a class="floating-link" href="rastreador.html">Abrir rastreador</a>
    </header>

    <aside id="painel" class="panel" aria-label="Menu de monitoramento">
        <div>
            <h1>Rastreamento de Onibus</h1>
            <p>Selecione um onibus para visualizar trajeto, descricao e horario.</p>
        </div>

        <p class="cards-intro">Linhas disponiveis agora</p>

        <ul id="locais-lista"></ul>

        <div class="legend">
            <span id="estado">Carregando locais...</span>
            <span>Icone azul: onibus disponivel</span>
            <span>Icone verde: onibus selecionado</span>
        </div>
    </aside>

    <div id="contador" class="pill">0 onibus online</div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMnCYEYdmL6G3Qck0rivbKi-g1P9lMyYU",
            authDomain: "maps2-6bf71.firebaseapp.com",
            projectId: "maps2-6bf71",
            storageBucket: "maps2-6bf71.firebasestorage.app",
            messagingSenderId: "944119305149",
            appId: "1:944119305149:web:91510adbd653e46edf78d4",
            measurementId: "G-SNRTBFDX41"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        isSupported().then((ok) => {
            if (ok) {
                getAnalytics(app);
            }
        });

        const painel = document.getElementById("painel");
        const menuToggle = document.getElementById("menu-toggle");
        const lista = document.getElementById("locais-lista");
        const estado = document.getElementById("estado");
        const mapaEstado = document.getElementById("mapa-estado");
        const contador = document.getElementById("contador");
        const themeToggle = document.getElementById("theme-toggle");

        const centroPadraoBrasil = [-14.235, -51.9253];
        const nomeColecao = "nomeDoLocal";
        const LIMITE_SINAL_MS = 2 * 60 * 1000;
        const JITTER_BASE_METROS = 12;
        const JITTER_MAX_METROS = 60;
        const JITTER_HOLD_MS = 15000;
        const FILTRO_ALPHA_CURTO = 0.28;
        const FILTRO_ALPHA_LONGO = 0.55;
        const RECENTER_MIN_INTERVAL_MS = 2500;
        const RECENTER_MIN_DESLOCAMENTO = 25;

        let localSelecionadoId = "";
        let ultimoFocoMs = 0;
        let ultimoFocoPosicao = null;

        const markers = new Map();
        const trilhas = new Map();
        const historicoPosicoes = new Map();
        const dadosPorId = new Map();
        const estadoSuavizacao = new Map();
        const STORAGE_THEME_KEY = "monitor-tema";
        const MAP_TILE_LIGHT = "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png";
        const MAP_TILE_DARK = "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png";

        const map = L.map("map", {
            zoomControl: false,
            preferCanvas: true
        }).setView(centroPadraoBrasil, 4);

        L.control.zoom({ position: "bottomright" }).addTo(map);

        const tileLayer = L.tileLayer(MAP_TILE_LIGHT, {
            attribution: "&copy; OpenStreetMap &copy; CARTO",
            maxZoom: 19
        }).addTo(map);

        function aplicarTema(tema) {
            const temaFinal = tema === "dark" ? "dark" : "light";
            document.body.setAttribute("data-theme", temaFinal);
            localStorage.setItem(STORAGE_THEME_KEY, temaFinal);
            themeToggle.textContent = temaFinal === "dark" ? "☀️" : "🌙";
            tileLayer.setUrl(temaFinal === "dark" ? MAP_TILE_DARK : MAP_TILE_LIGHT);
        }

        function iniciarTema() {
            const salvo = localStorage.getItem(STORAGE_THEME_KEY);
            if (salvo) {
                aplicarTema(salvo);
                return;
            }

            const prefereEscuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            aplicarTema(prefereEscuro ? "dark" : "light");
        }

        function criarIconeAtivo(ativo) {
            return L.divIcon({
                className: "",
                html: `<div class="bus-marker${ativo ? " active" : ""}" aria-hidden="true">&#128652;</div>`,
                iconSize: [26, 26],
                iconAnchor: [13, 13]
            });
        }

        function atualizarIndicadorSelecao() {
            markers.forEach((item, id) => {
                item.marker.setIcon(criarIconeAtivo(localSelecionadoId === id));
            });
        }

        function atualizarMensagemTopo(texto) {
            mapaEstado.textContent = texto;
        }

        function parseParteCoordenada(parte) {
            const limpa = parte.trim().replace("°", "").replace(/\s+/g, " ");
            const match = limpa.match(/(-?\d+(?:\.\d+)?)\s*([NSEW])?/i);
            if (!match) {
                return null;
            }

            let numero = Number(match[1]);
            if (Number.isNaN(numero)) {
                return null;
            }

            const direcao = match[2] ? match[2].toUpperCase() : "";
            if (direcao === "S" || direcao === "W") {
                numero = -Math.abs(numero);
            }

            return numero;
        }

        function converterCoordenadaTexto(texto) {
            const valor = texto.replace("[", "").replace("]", "").trim();
            const partes = valor.split(",");
            if (partes.length !== 2) {
                return null;
            }

            const lat = parseParteCoordenada(partes[0]);
            const lng = parseParteCoordenada(partes[1]);

            if (lat === null || lng === null) {
                return null;
            }

            return { lat, lng };
        }

        function obterCoordenadas(dados) {
            if (typeof dados.latitude === "number" && typeof dados.longitude === "number") {
                return { lat: dados.latitude, lng: dados.longitude };
            }

            if (typeof dados.latitude === "string" && typeof dados.longitude === "string") {
                const lat = Number(dados.latitude.replace(",", "."));
                const lng = Number(dados.longitude.replace(",", "."));
                if (!Number.isNaN(lat) && !Number.isNaN(lng)) {
                    return { lat, lng };
                }
            }

            if (typeof dados.lat === "number" && typeof dados.lng === "number") {
                return { lat: dados.lat, lng: dados.lng };
            }

            if (dados.coordenadas && typeof dados.coordenadas.latitude === "number" && typeof dados.coordenadas.longitude === "number") {
                return { lat: dados.coordenadas.latitude, lng: dados.coordenadas.longitude };
            }

            if (typeof dados.coordenadas === "string") {
                return converterCoordenadaTexto(dados.coordenadas);
            }

            return null;
        }

        function formatarCoordenadasTexto(coords) {
            const lat = Number(coords.lat).toFixed(6);
            const lng = Number(coords.lng).toFixed(6);
            return `Lat: ${lat}, Lng: ${lng}`;
        }

        function obterEnderecoExibicao(dados) {
            if (typeof dados.endereco === "string" && dados.endereco.trim()) {
                return dados.endereco;
            }
            if (typeof dados.localizacao === "string" && dados.localizacao.trim()) {
                return dados.localizacao;
            }
            if (typeof dados.coordenadas === "string" && dados.coordenadas.trim()) {
                return dados.coordenadas;
            }
            return "Endereco nao informado";
        }

        function obterNomeExibicao(dados) {
            return dados.nomeDoLocal || dados.nome || dados.titulo || "Onibus sem nome";
        }

        function obterAtualizacaoMs(dados) {
            const valor = dados.atualizadoEm || dados.ultimaAtualizacao || dados.updatedAt;
            if (!valor) {
                return null;
            }

            if (typeof valor.toMillis === "function") {
                return valor.toMillis();
            }

            if (valor instanceof Date) {
                return valor.getTime();
            }

            if (typeof valor === "number") {
                return valor;
            }

            if (typeof valor === "string") {
                const ms = Date.parse(valor);
                return Number.isNaN(ms) ? null : ms;
            }

            return null;
        }

        function dispositivoComSinalAtivo(dados, coords) {
            if (!coords) {
                return false;
            }

            const atualizadoMs = obterAtualizacaoMs(dados);
            if (!atualizadoMs) {
                return false;
            }

            return Date.now() - atualizadoMs <= LIMITE_SINAL_MS;
        }

        function obterPrecisaoMetros(dados) {
            const valor = dados.precisao ?? dados.accuracy ?? dados.acuracia;
            if (typeof valor === "number" && !Number.isNaN(valor)) {
                return valor;
            }

            if (typeof valor === "string") {
                const numero = Number(valor.replace(",", "."));
                if (!Number.isNaN(numero)) {
                    return numero;
                }
            }

            return 20;
        }

        function suavizarCoordenadas(id, coords, dados) {
            const agora = Date.now();
            const anterior = estadoSuavizacao.get(id);

            if (!anterior) {
                estadoSuavizacao.set(id, { lat: coords.lat, lng: coords.lng, ts: agora });
                return coords;
            }

            const deslocamento = map.distance([anterior.lat, anterior.lng], [coords.lat, coords.lng]);
            const precisao = obterPrecisaoMetros(dados);
            const limiarJitter = Math.min(JITTER_MAX_METROS, Math.max(JITTER_BASE_METROS, precisao * 0.65));

            if (deslocamento < limiarJitter && agora - anterior.ts < JITTER_HOLD_MS) {
                return { lat: anterior.lat, lng: anterior.lng };
            }

            const alpha = deslocamento > 120 ? FILTRO_ALPHA_LONGO : FILTRO_ALPHA_CURTO;
            const lat = anterior.lat + (coords.lat - anterior.lat) * alpha;
            const lng = anterior.lng + (coords.lng - anterior.lng) * alpha;
            const suavizada = { lat, lng };

            estadoSuavizacao.set(id, { lat, lng, ts: agora });
            return suavizada;
        }

        function obterStatusExibicao(dados) {
            const valor = (dados.status || dados.situacao || "No horario").toString().trim();
            return valor || "No horario";
        }

        function obterClasseStatus(status) {
            const normalizado = status.toLowerCase();
            if (normalizado.includes("atras")) {
                return "late";
            }
            if (normalizado.includes("cheg")) {
                return "coming";
            }
            if (normalizado.includes("fora") || normalizado.includes("paus") || normalizado.includes("offline")) {
                return "offline";
            }
            return "on-time";
        }

        function criarItemLocal(id, dados, coords) {
            const li = document.createElement("li");
            li.className = `device-item${localSelecionadoId === id ? " active" : ""}`;
            const nome = obterNomeExibicao(dados);
            const descricao = dados.descricao || dados.linha || dados.rota || "Rota sem descricao";
            const horario = dados.horario || dados.horarioSaida || dados.ultimaPartida || "Horario nao informado";
            const status = obterStatusExibicao(dados);
            const statusClasse = obterClasseStatus(status);
            const endereco = obterEnderecoExibicao(dados);
            li.innerHTML = `
                <div class="device-top">
                    <strong>${nome}</strong>
                </div>
                <div class="device-tags">
                    <span class="status-pill ${statusClasse}">[${status}]</span>
                    <span class="time-pill">${horario}</span>
                </div>
                <p class="device-desc">${descricao}</p>
                <span>${coords ? formatarCoordenadasTexto(coords) : endereco}</span>
                <small>ID: ${id}</small>
            `;

            if (coords) {
                li.addEventListener("click", () => {
                    localSelecionadoId = id;
                    focarEmDispositivo(id, true);
                    atualizarIndicadorSelecao();
                });
            }

            return li;
        }

        function focarEmDispositivo(id, forcar = false) {
            const dados = dadosPorId.get(id);
            const ponto = markers.get(id);
            if (!dados || !ponto) {
                return;
            }

            const nome = obterNomeExibicao(dados);
            const lat = ponto.marker.getLatLng().lat;
            const lng = ponto.marker.getLatLng().lng;
            const destino = [lat, lng];
            const agora = Date.now();

            if (!forcar && ultimoFocoPosicao) {
                const dist = map.distance(ultimoFocoPosicao, destino);
                const aindaNoCooldown = agora - ultimoFocoMs < RECENTER_MIN_INTERVAL_MS;
                if (aindaNoCooldown && dist < RECENTER_MIN_DESLOCAMENTO) {
                    atualizarMensagemTopo(`Seguindo ${nome} (${lat.toFixed(5)}, ${lng.toFixed(5)})`);
                    return;
                }
            }

            if (forcar) {
                map.flyTo(destino, Math.max(map.getZoom(), 16), { duration: 0.9 });
            } else {
                map.panTo(destino, { animate: true, duration: 0.6 });
            }

            ultimoFocoMs = agora;
            ultimoFocoPosicao = destino;

            atualizarMensagemTopo(`Seguindo ${nome} (${lat.toFixed(5)}, ${lng.toFixed(5)})`);
        }

        function atualizarTrilha(id, coords, ativo) {
            const historico = historicoPosicoes.get(id) || [];
            historico.push([coords.lat, coords.lng]);
            if (historico.length > 25) {
                historico.shift();
            }
            historicoPosicoes.set(id, historico);

            const cor = ativo ? "#0b7a67" : "#1f76bf";

            if (!trilhas.has(id)) {
                const poly = L.polyline(historico, {
                    color: cor,
                    weight: ativo ? 4 : 3,
                    opacity: ativo ? 0.72 : 0.45
                }).addTo(map);
                trilhas.set(id, poly);
                return;
            }

            const polyline = trilhas.get(id);
            polyline.setLatLngs(historico);
            polyline.setStyle({
                color: cor,
                weight: ativo ? 4 : 3,
                opacity: ativo ? 0.72 : 0.45
            });
        }

        function renderizarLocais(snapshot) {
            lista.innerHTML = "";
            const idsPresentes = new Set();

            if (snapshot.empty) {
                estado.textContent = `Nenhum local encontrado na colecao '${nomeColecao}'.`;
                localSelecionadoId = "";
                contador.textContent = "0 onibus online";
                atualizarMensagemTopo("Nenhum onibus ativo. Aguardando dados...");
                return;
            }

            let primeiroComCoordenadasId = "";
            let quantidadeComCoordenadas = 0;

            snapshot.forEach((documento) => {
                const dados = documento.data();
                const id = documento.id;
                const coordsBrutas = obterCoordenadas(dados);
                const sinalAtivo = dispositivoComSinalAtivo(dados, coordsBrutas);
                const nome = obterNomeExibicao(dados);

                if (!sinalAtivo) {
                    if (markers.has(id)) {
                        map.removeLayer(markers.get(id).marker);
                        markers.delete(id);
                    }
                    if (trilhas.has(id)) {
                        map.removeLayer(trilhas.get(id));
                        trilhas.delete(id);
                    }
                    historicoPosicoes.delete(id);
                    estadoSuavizacao.delete(id);
                    return;
                }

                const coords = suavizarCoordenadas(id, coordsBrutas, dados);

                idsPresentes.add(id);
                dadosPorId.set(id, dados);
                quantidadeComCoordenadas += 1;

                if (!primeiroComCoordenadasId) {
                    primeiroComCoordenadasId = id;
                }

                if (!markers.has(id)) {
                    const marker = L.marker([coords.lat, coords.lng], {
                        icon: criarIconeAtivo(localSelecionadoId === id)
                    }).addTo(map);

                    marker.bindTooltip(nome, {
                        direction: "top",
                        offset: [0, -10],
                        className: "bus-label"
                    });

                    marker.bindPopup(`<strong>${nome}</strong><br>${formatarCoordenadasTexto(coords)}<br>ID: ${id}`);

                    marker.on("click", () => {
                        localSelecionadoId = id;
                        atualizarIndicadorSelecao();
                        focarEmDispositivo(id, true);
                    });

                    markers.set(id, { marker });
                } else {
                    markers.get(id).marker.setLatLng([coords.lat, coords.lng]);
                    markers.get(id).marker.setTooltipContent(nome);
                    markers.get(id).marker.setPopupContent(`<strong>${nome}</strong><br>${formatarCoordenadasTexto(coords)}<br>ID: ${id}`);
                }

                const ativo = localSelecionadoId === id;
                atualizarTrilha(id, coords, ativo);
                lista.appendChild(criarItemLocal(id, dados, coords));
            });

            markers.forEach((item, id) => {
                if (!idsPresentes.has(id)) {
                    map.removeLayer(item.marker);
                    markers.delete(id);
                    estadoSuavizacao.delete(id);
                }
            });

            trilhas.forEach((polyline, id) => {
                if (!idsPresentes.has(id)) {
                    map.removeLayer(polyline);
                    trilhas.delete(id);
                    historicoPosicoes.delete(id);
                    estadoSuavizacao.delete(id);
                }
            });

            Array.from(dadosPorId.keys()).forEach((id) => {
                if (!idsPresentes.has(id)) {
                    dadosPorId.delete(id);
                }
            });

            if (localSelecionadoId && !dadosPorId.has(localSelecionadoId)) {
                localSelecionadoId = "";
            }

            if (!localSelecionadoId && primeiroComCoordenadasId) {
                localSelecionadoId = primeiroComCoordenadasId;
            }

            atualizarIndicadorSelecao();

            estado.textContent = `${quantidadeComCoordenadas} onibus com GPS ativo.`;
            contador.textContent = `${quantidadeComCoordenadas} onibus online`;

            if (quantidadeComCoordenadas === 0) {
                localSelecionadoId = "";
                ultimoFocoMs = 0;
                ultimoFocoPosicao = null;
                estado.textContent = "Nenhum onibus com sinal GPS ativo.";
                contador.textContent = "0 onibus online";
                atualizarMensagemTopo("Aguardando onibus enviar sinal de GPS...");
                map.setView(centroPadraoBrasil, 4);
                return;
            }

            if (localSelecionadoId) {
                focarEmDispositivo(localSelecionadoId);
            } else if (!localSelecionadoId) {
                atualizarMensagemTopo("Selecione um onibus no menu para acompanhar.");
            }
        }

        function mensagemErroFirestore(erro) {
            if (!erro || !erro.code) {
                return "Erro ao carregar locais. Verifique a configuracao e regras do Firestore.";
            }
            if (erro.code === "permission-denied") {
                return `Sem permissao para ler '${nomeColecao}'. Ajuste as regras do Firestore para permitir leitura.`;
            }
            if (erro.code === "unavailable") {
                return "Servico indisponivel no momento. Verifique internet e tente novamente.";
            }
            if (erro.code === "not-found") {
                return "Projeto ou banco nao encontrado. Confira projectId e configuracao do Firebase.";
            }
            return `Falha ao carregar locais (${erro.code}).`;
        }

        function bindUI() {
            menuToggle.addEventListener("click", () => {
                painel.classList.toggle("open");
            });

            themeToggle.addEventListener("click", () => {
                const atual = document.body.getAttribute("data-theme") === "dark" ? "dark" : "light";
                aplicarTema(atual === "dark" ? "light" : "dark");
            });

            map.on("click", () => {
                if (window.innerWidth <= 620) {
                    painel.classList.remove("open");
                }
            });

            window.addEventListener("resize", () => {
                map.invalidateSize();
                if (window.innerWidth > 620) {
                    painel.classList.add("open");
                }
            });

            if (window.innerWidth > 620) {
                painel.classList.add("open");
            }
        }

        const locaisRef = collection(db, nomeColecao);
        onSnapshot(
            locaisRef,
            (snapshot) => {
                renderizarLocais(snapshot);
            },
            (erro) => {
                console.error("Erro ao buscar locais:", erro);
                estado.textContent = mensagemErroFirestore(erro);
                atualizarMensagemTopo("Falha ao sincronizar dados em tempo real.");
            }
        );

        bindUI();
        iniciarTema();
        atualizarIndicadorSelecao();
        atualizarMensagemTopo("Mapa pronto. Aguardando onibus em tempo real...");
    </script>
</body>
</html>
